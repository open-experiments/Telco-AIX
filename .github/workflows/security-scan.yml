name: "Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "23 6 * * 1"  # weekly, Monday 06:23 UTC

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so leaks in old commits are caught
      - name: Run gitleaks (CLI)
        env:
          GITLEAKS_VERSION: "8.24.3"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  sast:
    name: Python SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install bandit
        run: pip install bandit
      - name: Run bandit (fail on high severity)
        run: bandit -r . --severity-level high

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit pinned lockfiles
        run: |
          python - <<'EOF'
          import json, subprocess, sys, pathlib
          failed = False
          # Audit Pipfile.lock pins (exact versions -> meaningful audit)
          for lock in pathlib.Path('.').rglob('Pipfile.lock'):
              pkgs = json.load(open(lock)).get('default', {})
              reqs = [f"{name}{meta['version']}" for name, meta in pkgs.items() if 'version' in meta]
              req_file = pathlib.Path('/tmp') / (lock.parent.name + '-lock.txt')
              req_file.write_text('\n'.join(reqs))
              print(f"Auditing {lock} ({len(reqs)} pins)")
              r = subprocess.run(['pip-audit', '-r', str(req_file), '--no-deps'])
              failed |= r.returncode != 0
          sys.exit(1 if failed else 0)
          EOF
